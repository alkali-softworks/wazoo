name: Build and Release Wazoo

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libmpv2 ffmpeg pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libgtk-3-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      - name: Disable Spotlight Indexing (macOS)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Cache libmpv (Windows)
        if: runner.os == 'Windows'
        id: cache-mpv-windows
        uses: actions/cache@v4
        with:
          path: target/mpv-win64
          key: mpv-win64-20260903

      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache-mpv-windows.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p target/mpv-win64 target/debug/deps target/release/deps
          curl -fSL --retry 3 -H "User-Agent: WazooBuild/1.0" -o target/mpv-win64/mpv-dev.7z "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-dev-x86_64-20260903-git-69e63f425a.7z"
          7z x target/mpv-win64/mpv-dev.7z -otarget/mpv-win64 -y
          cp target/mpv-win64/libmpv-2.dll .
          cp target/mpv-win64/libmpv-2.dll target/debug/
          cp target/mpv-win64/libmpv-2.dll target/debug/deps/

      - name: Link Cached libmpv (Windows)
        if: runner.os == 'Windows' && steps.cache-mpv-windows.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p target/debug/deps target/release/deps
          cp target/mpv-win64/libmpv-2.dll .
          cp target/mpv-win64/libmpv-2.dll target/debug/
          cp target/mpv-win64/libmpv-2.dll target/debug/deps/

      - name: Install Vulkan Runtime (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        continue-on-error: true
        with:
          install_runtime: true
          cache: true

      - name: Propagate Vulkan DLL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/debug/deps target/release/deps
          VULKAN_DLL=$(find "C:/VulkanSDK" "$VULKAN_SDK" "C:/Windows/System32" -maxdepth 4 -name "vulkan-1.dll" 2>/dev/null | head -n 1)
          if [ -n "$VULKAN_DLL" ] && [ -f "$VULKAN_DLL" ]; then
            echo "Found Vulkan DLL at: $VULKAN_DLL"
            cp "$VULKAN_DLL" .
            cp "$VULKAN_DLL" target/debug/
            cp "$VULKAN_DLL" target/debug/deps/
            cp "$VULKAN_DLL" target/release/
            cp "$VULKAN_DLL" target/release/deps/
          else
            echo "::warning::vulkan-1.dll not found in VulkanSDK search paths"
          fi

      - name: Run Tests
        run: cargo test --workspace -- --test-threads=1

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Artifacts
        shell: bash
        run: |
          mkdir -p dist

          if [ "$RUNNER_OS" = "Windows" ]; then
            PKG_NAME="wazoo-windows-x86_64"
            # 1. Single standalone executable
            cp target/release/wazoo.exe "dist/${PKG_NAME}.exe"
            cp target/release/wazoo.exe "dist/wazoo.exe"

            # 2. Also package zip
            mkdir -p "dist/tmp_${PKG_NAME}"
            cp target/release/wazoo.exe "dist/tmp_${PKG_NAME}/"
            if [ -f target/release/libmpv-2.dll ]; then
              cp target/release/libmpv-2.dll "dist/tmp_${PKG_NAME}/"
            elif [ -f libmpv-2.dll ]; then
              cp libmpv-2.dll "dist/tmp_${PKG_NAME}/"
            fi
            if [ -f target/release/vulkan-1.dll ]; then
              cp target/release/vulkan-1.dll "dist/tmp_${PKG_NAME}/"
            elif [ -f vulkan-1.dll ]; then
              cp vulkan-1.dll "dist/tmp_${PKG_NAME}/"
            elif [ -f "C:/Windows/System32/vulkan-1.dll" ]; then
              cp "C:/Windows/System32/vulkan-1.dll" "dist/tmp_${PKG_NAME}/"
            fi
            cp README.md LICENSE "dist/tmp_${PKG_NAME}/" 2>/dev/null || true

            if command -v 7z &> /dev/null; then
              7z a "dist/${PKG_NAME}.zip" "./dist/tmp_${PKG_NAME}/*"
            elif command -v powershell &> /dev/null; then
              powershell -Command "Compress-Archive -Path 'dist/tmp_${PKG_NAME}/*' -DestinationPath 'dist/${PKG_NAME}.zip' -Force"
            fi
            rm -rf "dist/tmp_${PKG_NAME}"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ARCH=$(uname -m)
            PKG_NAME="wazoo-macos-${ARCH}"
            cp target/release/wazoo "dist/${PKG_NAME}"
            chmod +x "dist/${PKG_NAME}"
            mkdir -p "dist/tmp_${PKG_NAME}"
            cp target/release/wazoo "dist/tmp_${PKG_NAME}/"
            chmod +x "dist/tmp_${PKG_NAME}/wazoo"
            cp README.md LICENSE "dist/tmp_${PKG_NAME}/" 2>/dev/null || true
            tar -czf "dist/${PKG_NAME}.tar.gz" -C "dist/tmp_${PKG_NAME}" .
            (cd "dist/tmp_${PKG_NAME}" && zip -r "../../dist/${PKG_NAME}.zip" .)
            rm -rf "dist/tmp_${PKG_NAME}"
          else
            # Linux
            PKG_NAME="wazoo-linux-x86_64"
            cp target/release/wazoo "dist/${PKG_NAME}"
            chmod +x "dist/${PKG_NAME}"

            # Build single-executable AppImage
            if [ -f scripts/build-appimage.sh ]; then
              ./scripts/build-appimage.sh || true
              if [ -f dist/wazoo-x86_64.AppImage ]; then
                cp dist/wazoo-x86_64.AppImage "dist/${PKG_NAME}.AppImage"
              fi
            fi

            mkdir -p "dist/tmp_${PKG_NAME}"
            cp target/release/wazoo "dist/tmp_${PKG_NAME}/"
            chmod +x "dist/tmp_${PKG_NAME}/wazoo"
            cp README.md LICENSE "dist/tmp_${PKG_NAME}/" 2>/dev/null || true
            tar -czf "dist/${PKG_NAME}.tar.gz" -C "dist/tmp_${PKG_NAME}" .
            rm -rf "dist/tmp_${PKG_NAME}"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wazoo-build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: warn

      - name: Create and Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.zip
            dist/*.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
