name: Build and Release Desktop App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: 2022

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Disable Spotlight Indexing (macOS)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Install Dependencies
        run: npm install

      - name: Rebuild Native Modules
        run: npm run rebuild

      - name: Run Package & Make
        shell: bash
        run: |
          for i in 1 2 3; do
            npm run make && break || {
              if [ $i -lt 3 ]; then
                echo "Build failed on attempt $i, retrying in 5s..."
                if [ "$RUNNER_OS" = "macOS" ]; then
                  hdiutil info 2>/dev/null | grep -o '/dev/disk[0-9]*' | xargs -I {} hdiutil detach -force {} 2>/dev/null || true
                fi
                sleep 5
              else
                echo "Build failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wazoo-build-${{ matrix.os }}
          path: |
            dist/electron/*.exe
            dist/electron/*.zip
            dist/electron/*.deb
            dist/electron/*.rpm
            dist/electron/*.AppImage
            dist/electron/*.dmg
            dist/electron/*.blockmap
          if-no-files-found: warn

      - name: Create and Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/electron/*.exe
            dist/electron/*.zip
            dist/electron/*.deb
            dist/electron/*.rpm
            dist/electron/*.AppImage
            dist/electron/*.dmg
            dist/electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
