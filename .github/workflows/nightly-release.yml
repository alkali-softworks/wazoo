name: Nightly Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Build all platforms in parallel
  # -------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: 2022
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest, macos-15-intel]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Disable Spotlight Indexing (macOS)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Electron App
        shell: bash
        run: |
          for i in 1 2 3; do
            npm run make && break || {
              if [ $i -lt 3 ]; then
                echo "Build failed on attempt $i, retrying in 5s..."
                if [ "$RUNNER_OS" = "macOS" ]; then
                  hdiutil info 2>/dev/null | grep -o '/dev/disk[0-9]*' | xargs -I {} hdiutil detach -force {} 2>/dev/null || true
                fi
                sleep 5
              else
                echo "Build failed after 3 attempts."
                exit 1
              fi
            }
          done

      # Save the installers temporarily so Stage 2 can harvest them
      - name: Upload Local Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wazoo-build-${{ matrix.os }}
          path: |
            dist/electron/*.exe
            dist/electron/*.zip
            dist/electron/*.deb
            dist/electron/*.rpm
            dist/electron/*.AppImage
            dist/electron/*.dmg
            dist/electron/*.blockmap
          if-no-files-found: warn
          retention-days: 1

  # -------------------------------------------------------------
  # STAGE 2: Combine everything into one single public release
  # -------------------------------------------------------------
  publish:
    name: Publish Public Nightly Release
    needs: build # Wait for all matrix builds to successfully finish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Download every asset compiled in Stage 1 into a local folder
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-assets
          pattern: wazoo-build-*
          merge-multiple: true # Flattens them into one clean directory

      # Inspect and prune any inadvertently created directories
      - name: Prepare Final Assets
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -lh final-assets/
          find final-assets -mindepth 1 -type d -exec rm -rf {} + || true

      # Delete previous release and tag so the landing page is cleanly recreated without orphaned assets
      - name: Reset Nightly Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

      - name: Update Public Nightly Release
        uses: ncipollo/release-action@v1
        with:
          tag: "nightly"
          name: "Nightly Development Build"
          body: |
            This is an automated nightly development build.
            Built from commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "final-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}